<article class="summary">
  <div class="year">
    <h3>년도</h3>
    <span>{{page.start_date | date: '%Y'}}</span>
  </div>
  {% include tag-list.html %}
  {% if page.tools%}
    <div>
      <h3>도구</h3>
      <ul>
        {% for tool in page.tools %}
          <li>{{ tool }}</li>
        {% endfor %}
      </ul>
    </div>
  {% endif %}
  {% if page.specifications %}
  <div>
    <h3>규격</h3>
    <ul>
      {% for item in page.specifications %}
        <li>{{ item }}</li>
      {% endfor %}
    </ul>
  </div>
  {% endif %}
</article>
